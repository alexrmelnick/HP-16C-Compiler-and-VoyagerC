name: Build executables

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86-64:
    name: Linux x86-64
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: ./build-linux.sh

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: jovial-linux-x86_64
          path: dist/jovial-linux-x86_64
          if-no-files-found: error

  windows-x86-64:
    name: Windows x86-64
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm jovial.spec

      - name: Smoke-test executable
        run: .\dist\jovial.exe --version

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: jovial-windows-x86_64
          path: dist/jovial.exe
          if-no-files-found: error
